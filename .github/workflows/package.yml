name: Package
on:
  push:
    tags: ["v*"]
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: mlugg/setup-zig@v2
        with:
            version: 0.17.0
      - run: zig build release -Dversion=${{ github.ref_name }}
      - uses: softprops/action-gh-release@v3
        with:
          files: zig-out/release/*
              